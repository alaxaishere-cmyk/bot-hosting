name: image

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        run: echo "IMG=ghcr.io/$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # plain docker build/push — fewer moving parts than buildx + gha cache.
      # Failures are echoed as ::error:: annotations so they are readable over the API
      # (the raw log host is not reachable from every network).
      - name: Build
        run: |
          set +e
          docker build -t "$IMG" . >build.log 2>&1
          code=$?
          set -e
          if [ "$code" != "0" ]; then
            msg=$(grep -iE "error|denied|cannot|failed" build.log | tail -3 | cut -c1-160 | paste -sd' ' - | tr -d '"')
            echo "::error::docker build failed: ${msg:-see log}"
            exit 1
          fi
          tail -3 build.log
          docker image ls --digests | head -3

      - name: Push to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >login.log 2>&1 \
            || { echo "::error::ghcr login failed: $(tail -2 login.log | paste -sd' ' -)"; exit 1; }
          docker push "$IMG" >push.log 2>&1
          code=$?
          if [ "$code" != "0" ]; then
            msg=$(grep -iE "denied|unauthorized|error|name unknown" push.log | tail -2 | cut -c1-160 | paste -sd' ' - | tr -d '"')
            echo "::error::ghcr push failed: ${msg:-see log}. deploy.sh still works — it builds from source on the VPS."
            exit 1
          fi
          tail -2 push.log
          echo "### pushed \`$IMG\`" >> "$GITHUB_STEP_SUMMARY"
