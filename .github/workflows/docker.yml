name: image

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: lowercase image slug
        id: slug
        run: echo "repo=${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.slug.outputs.repo }}:latest
            ghcr.io/${{ steps.slug.outputs.repo }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: how to run it
        if: github.event_name != 'pull_request'
        run: |
          echo "::notice::Image pushed. Public URL in one command on any VPS:  DOMAIN=bot.example.com curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/deploy/deploy.sh | sudo DOMAIN=bot.example.com bash"
